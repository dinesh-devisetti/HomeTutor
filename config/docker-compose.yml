services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: hometutoring
      POSTGRES_PASSWORD: hometutoring
      POSTGRES_DB: hometutoring
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hometutoring"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
